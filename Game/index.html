<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pyramid Sliding Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* REMOVED touch-action: none; from everywhere */
        }
       body {
            background-color: #1a0f1d;
            color: #ffd700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed from center to allow top-down scrolling */
            min-height: 100vh;           /* Changed height to min-height */
            margin: 0;
            padding: 20px;
            overflow-y: auto;            /* Enables vertical scrolling */
        }
        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }
        #level-info {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #e0b0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Container layout holding both reference image and active board */
        .game-layout {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .reference-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .reference-card span {
            font-size: 0.85rem;
            color: #e0b0ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #reference-img {
            width: 140px;
            height: 140px;
            border: 4px solid #4a2850;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

       #puzzle-container {
            touch-action: none;
            width: 320px;
            height: 320px;
            background: #2b1730;
            border: 6px solid #4a2850;
            border-radius: 12px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 0;
            cursor: grab;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 2px 4px rgba(0, 0, 0, 0.4);
            background-repeat: no-repeat;
            background-size: 304px 304px;
            transition: transform 0.15s ease-in-out, box-shadow 0.2s;
        }
        .tile:active {
            cursor: grabbing;
        }
        .tile.empty {
            background: transparent !important;
            box-shadow: none;
            cursor: default;
        }
        /* Hint highlight animation */
        .tile.hint-tile {
            box-shadow: inset 0 0 0 4px #00ffff, 0 0 18px #00ffff !important;
            z-index: 10;
            animation: pulse 0.4s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.96); }
            to { transform: scale(1.02); }
        }
        #status {
            margin-top: 20px;
            font-size: 1.1rem;
            height: 24px;
            font-weight: bold;
            text-align: center;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #1a0f1d;
            background: #ffd700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
            touch-action: auto;
        }
        button:active {
            transform: scale(0.95);
        }
        #hint-btn {
            background: #00bcd4;
            color: #00252b;
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
        }
        #next-btn {
            background: #00e676;
            color: #003311;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
            display: none;
        }
    </style>
</head>
<body>

    <h1>Escape From Pyramid Quest!</h1>
    <div id="level-info">Level 1</div>
    
    <div class="game-layout">
        <!-- Target Reference Image Box -->
        <div class="reference-card">
            <span>Target Goal</span>
            <img id="reference-img" src="" alt="Target Reference">
        </div>

        <!-- Sliding Puzzle Grid -->
        <div id="puzzle-container"></div>
    </div>

    <div id="status"></div>
    
    <div class="button-group">
        <button id="shuffle-btn" onclick="initGame()">Shuffle Board</button>
        <button id="hint-btn" onclick="showHint()">💡 Hint</button>
        <button id="next-btn" onclick="nextLevel()">Next Level ➔</button>
    </div>
    <footer style="color: #ffffff; font-size: 12px; text-align: center; opacity: 0.8; font-family: sans-serif;">
  <p>© All rights reserved to Azhar Zia</p>
    </footer>

    <script>
        const GRID_SIZE = 4; // 4x4 Grid
        const EMPTY_TILE = GRID_SIZE * GRID_SIZE - 1; // Tile 15
        
        const IMAGE_URLS = [
            'gameimage1.jpg',
            'gameimage2.jpg',
            'gameimage3.jpg',
            'gameimage4.jpg',
            'gameimage5.jpg',
            'gameimage6.jpg',
            'gameimage7.jpg',
            'gameimage8.jpg',
            'gameimage9.jpg'
        ]; 

        let currentLevel = 0;
        let tiles = [];
        let cachedHintPath = []; 

        const container = document.getElementById('puzzle-container');
        const refImage = document.getElementById('reference-img');
        const statusText = document.getElementById('status');
        const levelInfo = document.getElementById('level-info');
        const nextBtn = document.getElementById('next-btn');

        // Touch / Gesture Variables
        let startX = 0;
        let startY = 0;
        let activeTileIndex = null;

        function initGame() {
            statusText.innerText = '';
            nextBtn.style.display = 'none';
            levelInfo.innerText = `Level ${currentLevel + 1} of ${IMAGE_URLS.length}`;
            refImage.src = IMAGE_URLS[currentLevel];
            cachedHintPath = [];

            do {
                tiles = Array.from({ length: GRID_SIZE * GRID_SIZE }, (_, i) => i);
                shuffle(tiles);
            } while (!isSolvable(tiles) || isSolved(tiles));

            render();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function isSolvable(arr) {
            let inversions = 0;
            const emptyIndex = arr.indexOf(EMPTY_TILE);
            const emptyRowFromBottom = GRID_SIZE - Math.floor(emptyIndex / GRID_SIZE);

            for (let i = 0; i < arr.length; i++) {
                for (let j = i + 1; j < arr.length; j++) {
                    if (arr[i] !== EMPTY_TILE && arr[j] !== EMPTY_TILE && arr[i] > arr[j]) {
                        inversions++;
                    }
                }
            }

            if (emptyRowFromBottom % 2 === 0) {
                return inversions % 2 !== 0;
            } else {
                return inversions % 2 === 0;
            }
        }

        function render() {
            container.innerHTML = '';
            const tileSize = 304 / GRID_SIZE;
            const currentImage = IMAGE_URLS[currentLevel];

            tiles.forEach((val, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.index = index;

                if (val === EMPTY_TILE) {
                    tile.classList.add('empty');
                } else {
                    const origRow = Math.floor(val / GRID_SIZE);
                    const origCol = val % GRID_SIZE;
                    const xPos = -(origCol * tileSize);
                    const yPos = -(origRow * tileSize);

                    tile.style.backgroundImage = `url('${currentImage}')`;
                    tile.style.backgroundPosition = `${xPos}px ${yPos}px`;
                    
                    // Attach pointer drag / slide gestures
                    tile.addEventListener('pointerdown', (e) => handlePointerDown(e, index));
                }
                container.appendChild(tile);
            });
        }

        // --- SLIDE GESTURE LOGIC ---

        function handlePointerDown(e, index) {
            startX = e.clientX;
            startY = e.clientY;
            activeTileIndex = index;

            const onPointerMove = (moveEvent) => {
                if (activeTileIndex === null) return;

                const diffX = moveEvent.clientX - startX;
                const diffY = moveEvent.clientY - startY;
                const minSwipeDistance = 20; // Minimum drag sensitivity in pixels

                if (Math.abs(diffX) > minSwipeDistance || Math.abs(diffY) > minSwipeDistance) {
                    const emptyIndex = tiles.indexOf(EMPTY_TILE);
                    const row = Math.floor(activeTileIndex / GRID_SIZE);
                    const col = activeTileIndex % GRID_SIZE;
                    const emptyRow = Math.floor(emptyIndex / GRID_SIZE);
                    const emptyCol = emptyIndex % GRID_SIZE;

                    let intendedMove = false;

                    // Determine intended drag direction towards the empty space
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        // Horizontal Swipe
                        if (diffX > 0 && emptyRow === row && emptyCol === col + 1) intendedMove = true;
                        if (diffX < 0 && emptyRow === row && emptyCol === col - 1) intendedMove = true;
                    } else {
                        // Vertical Swipe
                        if (diffY > 0 && emptyRow === row + 1 && emptyCol === col) intendedMove = true;
                        if (diffY < 0 && emptyRow === row - 1 && emptyCol === col) intendedMove = true;
                    }

                    if (intendedMove) {
                        moveTile(activeTileIndex);
                    }

                    // Reset tracking to prevent double triggers
                    cleanup();
                }
            };

            const onPointerUp = () => {
                cleanup();
            };

            const cleanup = () => {
                activeTileIndex = null;
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            };

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(EMPTY_TILE);
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const emptyRow = Math.floor(emptyIndex / GRID_SIZE);
            const emptyCol = emptyIndex % GRID_SIZE;

            const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

            if (isAdjacent) {
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                cachedHintPath = []; // Invalidate cached path on manual moves
                render();
                if (isSolved(tiles)) {
                    if (currentLevel < IMAGE_URLS.length - 1) {
                        statusText.innerText = '🎉 Level Solved!';
                        nextBtn.style.display = 'inline-block';
                    } else {
                        statusText.innerText = '🏆 You completed all levels!';
                    }
                }
            }
        }

        // --- SUB-GOAL PATH ENGINE FOR HINTS ---

        function getStageInfo(state) {
            if (state[0] !== 0) return { targets: [0], isDone: s => s[0] === 0, locked: [] };
            if (state[1] !== 1) return { targets: [1], isDone: s => s[1] === 1, locked: [0] };
            if (state[2] !== 2 || state[3] !== 3) return { targets: [2, 3], isDone: s => s[2] === 2 && s[3] === 3, locked: [0, 1] };
            if (state[4] !== 4) return { targets: [4], isDone: s => s[4] === 4, locked: [0, 1, 2, 3] };
            if (state[5] !== 5) return { targets: [5], isDone: s => s[5] === 5, locked: [0, 1, 2, 3, 4] };
            if (state[6] !== 6 || state[7] !== 7) return { targets: [6, 7], isDone: s => s[6] === 6 && s[7] === 7, locked: [0, 1, 2, 3, 4, 5] };
            return { targets: [8, 9, 10, 11, 12, 13, 14, 15], isDone: s => isSolved(s), locked: [0, 1, 2, 3, 4, 5, 6, 7] };
        }

        function getStageHeuristic(state, targets) {
            let h = 0;
            for (let t of targets) {
                const currentIdx = state.indexOf(t);
                const cr = Math.floor(currentIdx / GRID_SIZE);
                const cc = currentIdx % GRID_SIZE;
                const tr = Math.floor(t / GRID_SIZE);
                const tc = t % GRID_SIZE;
                h += Math.abs(cr - tr) + Math.abs(cc - tc);
            }
            return h;
        }

        function findPathForStage(startState) {
            const stage = getStageInfo(startState);
            if (stage.isDone(startState)) return [];

            const openSet = [{
                state: startState,
                path: [],
                g: 0,
                h: getStageHeuristic(startState, stage.targets)
            }];

            const visited = new Set();
            visited.add(startState.join(','));

            while (openSet.length > 0) {
                openSet.sort((a, b) => (a.g + a.h) - (b.g + b.h));
                const current = openSet.shift();

                if (stage.isDone(current.state)) {
                    return current.path;
                }

                const emptyIndex = current.state.indexOf(EMPTY_TILE);
                const row = Math.floor(emptyIndex / GRID_SIZE);
                const col = emptyIndex % GRID_SIZE;

                const neighbors = [
                    { r: row - 1, c: col },
                    { r: row + 1, c: col },
                    { r: row, c: col - 1 },
                    { r: row, c: col + 1 }
                ];

                for (const n of neighbors) {
                    if (n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE) {
                        const targetIndex = n.r * GRID_SIZE + n.c;

                        if (stage.locked.includes(targetIndex)) continue;

                        const newState = [...current.state];
                        [newState[emptyIndex], newState[targetIndex]] = [newState[targetIndex], newState[emptyIndex]];

                        const key = newState.join(',');
                        if (!visited.has(key)) {
                            visited.add(key);
                            openSet.push({
                                state: newState,
                                path: [...current.path, targetIndex],
                                g: current.g + 1,
                                h: getStageHeuristic(newState, stage.targets)
                            });
                        }
                    }
                }
            }
            return [];
        }

        function showHint() {
            if (isSolved(tiles)) return;

            const emptyIdx = tiles.indexOf(EMPTY_TILE);
            if (cachedHintPath.length > 0) {
                const nextTileIdx = cachedHintPath[0];
                const er = Math.floor(emptyIdx / GRID_SIZE);
                const ec = emptyIdx % GRID_SIZE;
                const tr = Math.floor(nextTileIdx / GRID_SIZE);
                const tc = nextTileIdx % GRID_SIZE;

                if (Math.abs(er - tr) + Math.abs(ec - tc) !== 1) {
                    cachedHintPath = [];
                }
            }

            if (cachedHintPath.length === 0) {
                cachedHintPath = findPathForStage(tiles);
            }

            if (cachedHintPath.length > 0) {
                const nextMoveTileIndex = cachedHintPath.shift();
                const tileElements = container.querySelectorAll('.tile');
                const targetElement = tileElements[nextMoveTileIndex];

                if (targetElement) {
                    targetElement.classList.add('hint-tile');
                    statusText.innerText = '💡 Drag the highlighted tile!';
                    setTimeout(() => {
                        targetElement.classList.remove('hint-tile');
                        if (!isSolved(tiles)) statusText.innerText = '';
                    }, 1500);
                }
            }
        }

        function nextLevel() {
            if (currentLevel < IMAGE_URLS.length - 1) {
                currentLevel++;
                initGame();
            }
        }

        function isSolved(arr) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== i) return false;
            }
            return true;
        }

        initGame();
    </script>
</body>
</html>
